# Nginx site for futurizetechnology.com
# Installed by deploy/setup-server.sh. Certbot adds the HTTPS (443) blocks
# and the HTTP -> HTTPS redirect when it issues the certificate.
#
#   futurizetechnology.com      -> the site (canonical address)
#   www.futurizetechnology.com  -> 301 redirect to futurizetechnology.com

upstream futurize_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.futurizetechnology.com;
    return 301 https://futurizetechnology.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name futurizetechnology.com;

    client_max_body_size 1m;

    # Hashed build assets never change: cache for a year.
    location /_next/static/ {
        proxy_pass http://futurize_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://futurize_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}
